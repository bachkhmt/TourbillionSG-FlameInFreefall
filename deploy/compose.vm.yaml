# Compose >=2.24.4 required for !override (avoids accidentally retaining host ports).
services:
  backend:
    ports: !override []
  frontend:
    ports: !override []
  caddy:
    image: caddy:2-alpine
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?Set real public DNS name}
      ACME_EMAIL: ${ACME_EMAIL:?Set certificate contact}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
