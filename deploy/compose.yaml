name: flameguard-demo

x-backend: &backend
  image: ${BACKEND_IMAGE:-flameguard-api:local}
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: flameguard_demo_local
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD}
      READER_PASSWORD: ${READER_PASSWORD:?Set READER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./local/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    # No host port: migration/seed services use the internal network.
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d flameguard_demo_local']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    profiles: [tools]
    environment:
      APP_ENV: development
      DEBUG: 'false'
      DATABASE_URL: postgresql+asyncpg://flameguard_owner:${OWNER_PASSWORD:?Set OWNER_PASSWORD}@postgres:5432/flameguard_demo_local
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}

  seed-demo:
    <<: *backend
    profiles: [tools]
    # Existing synthetic seeder deliberately accepts loopback targets only.
    network_mode: service:postgres
    environment:
      APP_ENV: development
      DEBUG: 'false'
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD}
    command: [python, deployment/seed_local.py, --allow-synthetic]
    volumes:
      - collection_data:/var/lib/flameguard/collection
    depends_on:
      postgres: {condition: service_healthy}

  backend:
    <<: *backend
    environment:
      APP_ENV: development
      DEBUG: 'false'
      DATABASE_URL: postgresql+asyncpg://flameguard_reader:${READER_PASSWORD:?Set READER_PASSWORD}@postgres:5432/flameguard_demo_local
      CATALOG_COLLECTION_MANIFEST: /var/lib/flameguard/collection/collection.json
      CORS_ORIGINS: '["http://localhost:3000"]'
      CHAT_PROVIDER: unavailable
      PREDICTION_PROVIDER: unavailable
    volumes:
      - collection_data:/var/lib/flameguard/collection:ro
      - artifact_data:/var/lib/flameguard/artifacts:ro
    ports: ['127.0.0.1:${BACKEND_PORT:-8000}:8000']
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-flameguard-web:local}
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    ports: ['127.0.0.1:${FRONTEND_PORT:-3000}:3000']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/dashboard').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres_data:
  collection_data:
  artifact_data:
